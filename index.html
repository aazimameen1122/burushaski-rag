<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BurushaskiRAG — ask the Burushaski archive</title>
<meta name="description" content="Ask the Burushaski Digital Archive in plain English: dictionary words in Srinagar and Gilgit dialects, recordings, and community history.">
<style>
  :root{ --ink:#122019; --ink-2:#43534b; --ink-3:#75837b; --paper:#f6f8f7; --card:#fff; --line:#dde5e0; --accent:#c96a17; --accent-dark:#a5560f; --radius:14px; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
  a{color:var(--accent-dark);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  header.site{border-bottom:1px solid var(--line);background:#fff}
  .nav{display:flex;align-items:center;justify-content:space-between;height:56px}
  .brand{font-weight:700;font-size:17px;color:var(--ink)}
  .brand em{font-style:normal;color:var(--accent)}
  .nav a{font-size:14px;font-weight:500;color:var(--ink-2)}
  main{padding:52px 0 30px}
  h1{font-size:36px;line-height:1.2;letter-spacing:-.02em;margin:0 0 10px;font-weight:800}
  h1 em{font-style:normal;color:var(--accent)}
  .lede{font-size:17px;color:var(--ink-2);margin:0;max-width:560px}
  .status{margin-top:14px;font-size:13.5px;color:var(--ink-3)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:26px 0;box-shadow:0 1px 2px rgba(18,32,25,.05),0 8px 24px rgba(18,32,25,.05)}
  .askrow{display:flex;gap:10px}
  input{flex:1;padding:13px 15px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fbfcfb;color:var(--ink);font-family:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  button.go{padding:13px 24px;font-size:15.5px;font-weight:600;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
  button.go:hover{background:var(--accent-dark)}
  .chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#fff;border:1px solid var(--line);color:var(--ink-2);padding:8px 13px;font-size:13.5px;border-radius:999px;cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--accent);color:var(--accent-dark)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px}
  .card.top{border-left:5px solid var(--accent)}
  .meta{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
  .card p{margin:0}
  .refused{background:#fff;border:1.5px dashed var(--accent);border-radius:var(--radius);padding:18px;margin-top:14px;font-weight:500}
  .more h3{margin:24px 0 2px;font-size:15px}
  footer.site{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 36px;color:var(--ink-3);font-size:13.5px}
  @media (max-width:640px){ h1{font-size:29px} .askrow{flex-direction:column} }
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <div class="brand">Burushaski<em>RAG</em></div>
    <a href="https://github.com/aazimameen1122/burushaski-rag">GitHub</a>
  </div>
</header>

<main class="wrap">
  <h1>Ask the Burushaski <em>archive</em>.</h1>
  <p class="lede">Word meanings in both dialects, the recordings, the community's history — answered from the archive itself. If it is not in the archive, it will say so.</p>
  <p class="status" id="status">Loading…</p>

  <div class="panel">
    <div class="askrow">
      <input id="q" type="text" placeholder="What is the Burushaski word for house?" aria-label="Your question">
      <button class="go" id="go">Ask</button>
    </div>
    <div class="chips">
      <button class="chip">What is the Burushaski word for house?</button>
      <button class="chip">How do you say tomorrow in Burushaski?</button>
      <button class="chip">What is the Burushaski word for tea?</button>
      <button class="chip">When did the princes of Hunza and Nagar migrate to Kashmir?</button>
      <button class="chip">Which folk song recordings are in the archive?</button>
    </div>
    <div id="result"></div>
  </div>
</main>

<footer class="site">
  <div class="wrap">Built by Aazim Ameen · Data from the <a href="https://github.com/aazimameen1-dotcom/Burushaski-Digital-Archive">Burushaski Digital Archive</a></div>
</footer>

<script src="app.js"></script>
</body>
</html>
